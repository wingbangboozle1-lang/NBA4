# Task BU (session arena/af666c53-nba4): official-page transport probe.
#
# Why this exists: the `daily-refresh` job has been red since PR #59 because its
# fetch phase targets the `stats.nba.com` JSON endpoints, and no session has been
# able to observe what a GitHub-hosted runner actually sees for those URLs —
# every earlier observation came from a sandbox whose egress is restricted to
# GitHub/npm/PyPI hosts (BH-05, P11-03). This workflow is the missing
# observation: it runs on a GitHub-hosted runner with unrestricted egress and
# records status / content-type / byte length / sha256 for every URL the
# scheduled job depends on, then commits the raw evidence to this branch.
#
# Trigger: a push to this session's branch that changes the capture script or
# this file, or a manual workflow_dispatch. It never runs on a schedule and its
# own output commits land under `data/official-pages/**` only, so the job cannot
# re-trigger itself or race the daily-refresh job.
#
# NOTE (task DI, 2026-11-19): `workflow_dispatch` could not be invoked from a
# session's GitHub credentials (HTTP 403 "Resource not accessible by
# integration"), recorded as flag BU-02. That is a token-permission setting on the
# account that starts the run, not a defect in this file; the push trigger remains
# the permission-free path. The trigger below is no longer pinned to a dead branch.
#
# Output (committed to the branch it ran on):
#   data/official-pages/<date>/manifest.json   one record per URL
#   data/official-pages/<name>.head.html       first 300 KB of a raw HTML body
#   data/official-pages/<name>.next.json       the __NEXT_DATA__ blob, if found
#   data/official-pages/<name>.pdf             a PDF body, if it is a PDF

name: capture-official-pages

on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date label for the capture directory, YYYY-MM-DD (blank = today)"
        type: string
        required: false
      targets:
        description: "comma-separated keys from TARGETS below, or 'all'"
        type: string
        default: all
  # Any arena/** branch (or main) that changes the capture script or this file
  # captures its own evidence. The old trigger was pinned to arena/af666c53-nba4,
  # which is merged and dead — that is the defect task DI repairs.
  push:
    branches:
      - "arena/**"
      - main
    paths:
      - ".github/workflows/capture-official-pages.yml"
      - "scripts/capture_official_pages.py"

permissions:
  contents: write

concurrency:
  group: capture-official-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the branch this run was started from
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture the official pages
        env:
          CAPTURE_DATE: ${{ github.event.inputs.date }}
          CAPTURE_TARGETS: ${{ github.event.inputs.targets }}
        run: python3 scripts/capture_official_pages.py

      - name: Commit the capture to the run branch
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no capture to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "capture-official-pages: ${CAPTURE_DATE:-today} capture from a GitHub-hosted runner (${GITHUB_REF#refs/heads/})"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
        env:
          CAPTURE_DATE: ${{ github.event.inputs.date }}
