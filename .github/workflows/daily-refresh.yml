# Task BH (session arena/cbc8e41a-nba4): the scheduled refresh job.
#
# Brief: "Extend the scheduled job to refresh the official schedule, standings,
# team statistics and injury report for each rolling slate, then rebuild only
# after freshness and provenance gates pass."
#
# Behaviour:
#   * cron (10:15 UTC daily) runs mode=gates: fetch -> freshness -> provenance ->
#     build gates, all asserted; exit 1 on any failure (fail closed). When every
#     gate passes, the site tables are regenerated and committed only then.
#   * workflow_dispatch runs mode=probe or mode=gates (input below). Probe
#     asserts fetch reachability/parseability only, so connectivity can be
#     verified independently of staleness alarms.
#   * The schedule-PDF sha baseline is committed to data/snapshots/raw/ci/ so a
#     silent re-issue of the official schedule PDF trips the drift gate.
#   * GITHUB_TOKEN pushes do not trigger new workflow runs (no recursion), and
#     the job has no pull_request trigger, so it cannot race a session branch.

name: daily-refresh

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "gates = full fail-closed run; probe = fetch reachability only"
        type: choice
        options: [gates, probe]
        default: gates

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF header reader
        run: python -m pip install --quiet "pypdf==5.1.0"

      - name: Run the refresh gates
        id: gates
        continue-on-error: true
        run: |
          python3 scripts/scheduled_refresh.py \
            --mode "${{ github.event.inputs.mode || 'gates' }}" \
            --json run-record.json | tee refresh-out.txt

      - name: Publish the run record to the job summary
        if: always()
        run: |
          if [ -f run-record.json ]; then
            {
              echo "## scheduled_refresh run record"
              echo '```json'
              cat run-record.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the run record artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-refresh-${{ github.run_id }}
          path: |
            run-record.json
            refresh-out.txt
          if-no-files-found: warn
          retention-days: 90

      # Commit only what the gates licensed: the schedule-sha baseline (fetch
      # phase) and — in gates mode, all gates green — regenerated site tables.
      - name: Commit gated output
        if: steps.gates.outcome == 'success'
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "No gated changes to commit."
          else
            git config user.name "daily-refresh[bot]"
            git config user.email "daily-refresh@users.noreply.github.com"
            git commit -m "daily-refresh: gated baseline/table update (${{ github.event.inputs.mode || 'gates' }} mode, run ${{ github.run_id }})"
            git push
          fi

      - name: Fail the run when a gate failed
        if: steps.gates.outcome != 'success'
        run: |
          echo "One or more freshness/provenance/build gates failed; nothing was rebuilt or committed."
          exit 1
